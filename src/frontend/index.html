    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---- Desktop dropdown ----
            const aboutBtn = document.getElementById('aboutBtn');
            const dropdown = document.getElementById('dropdownMenu');

            function toggleDropdown(e) {
                e.stopPropagation();
                dropdown.classList.toggle('hidden');
            }

            aboutBtn.addEventListener('click', toggleDropdown);

            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                const container = document.getElementById('aboutDropdown');
                if (!container.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            // ---- Mobile menu toggle ----
            const mobileBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');

            mobileBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });

            // ---- Mobile dropdown toggle ----
            const mobileAboutBtn = document.getElementById('mobileAboutBtn');
            const mobileDropdown = document.getElementById('mobileDropdown');
            const mobileChevron = document.getElementById('mobileChevron');

            mobileAboutBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                mobileDropdown.classList.toggle('hidden');
                mobileChevron.classList.toggle('rotate-180');
            });

        })();
    </script>
